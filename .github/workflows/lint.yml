name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - run: luarocks install luacheck 1.2.0

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.20.3

      - name: Run luacheck on changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The PR checkout only holds the merge commit, so the base revision
          # has to be fetched before anything can be diffed against it.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.lua' > changed.txt
          if [ ! -s changed.txt ]; then
            echo "No Lua files changed."
            exit 0
          fi

          # luacheck exits non-zero on any finding, which would end the step
          # before reviewdog narrows those findings down to the changed lines.
          xargs -r luacheck --codes --formatter plain < changed.txt > luacheck.out || true
          cat luacheck.out

          # The local reporter needs no token, so this behaves the same for
          # pull requests from forks, which is how most contributions arrive.
          reviewdog \
            -f=luacheck \
            -diff="git diff $BASE_SHA" \
            -reporter=local \
            -filter-mode=added \
            -fail-level=any \
            < luacheck.out
