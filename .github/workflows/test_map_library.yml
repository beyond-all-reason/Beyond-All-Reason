name: Test Map Library

on:
  pull_request:
    paths:
      - 'tools/map_library/**'
      - '.github/workflows/test_map_library.yml'
  push:
    paths:
      - 'tools/map_library/**'
      - '.github/workflows/test_map_library.yml'

permissions:
  contents: read

jobs:
  git-integration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test temporary local Git repositories
        run: python -m unittest discover -s tools/map_library -p "test_*.py" -v