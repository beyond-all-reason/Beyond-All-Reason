name: Run Unit Tests

on:
  push:
    branches: ['**'] # needs to tolerate a slash but not run on tag pushes
  pull_request:
    branches: ['**'] # needs to tolerate a slash but not run on tag pushes

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Lua 5.1
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev

    - name: Install Lux
      env:
        LUX_VERSION: '0.28.3'
      run: |
        # Fetch the prebuilt `lx` straight from the release page. Resolving
        # it through cargo-binstall (or the lux action) goes via the GitHub
        # API, which sporadically rate-limits unauthenticated runners;
        # release downloads don't count against that limit.
        curl -L --proto '=https' --tlsv1.2 -sSf \
          "https://github.com/nvim-neorocks/lux/releases/download/v${LUX_VERSION}/lx-x86_64-unknown-linux-gnu.tar.gz" \
          | sudo tar -xz -C /usr/local/bin lx
        lx --version

    - name: Cache Lux dependencies
      uses: actions/cache@v4
      with:
        path: .lux
        key: lux-5.1-${{ runner.os }}-${{ hashFiles('lux.lock') }}
        restore-keys: |
          lux-5.1-${{ runner.os }}-

    - name: Run busted
      run: lx --lua-version 5.1 test

    # Specs are not allowed to depend on each other, so the same suite has to pass
    # in a different order. The seed comes from the commit so a re-run repeats the
    # order exactly, while a later commit tries a different one.
    - name: Run busted in a shuffled order
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        SPEC_SHUFFLE_SEED=$((0x${HEAD_SHA:0:7}))
        export SPEC_SHUFFLE_SEED
        echo "Shuffling with SPEC_SHUFFLE_SEED=$SPEC_SHUFFLE_SEED; reproduce with:"
        echo "  SPEC_SHUFFLE_SEED=$SPEC_SHUFFLE_SEED lx --lua-version 5.1 test"
        lx --lua-version 5.1 test
