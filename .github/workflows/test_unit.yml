name: Run Unit Tests

on:
  push:
    branches: ['**'] # needs to tolerate a slash but not run on tag pushes
  pull_request:
    branches: ['**'] # needs to tolerate a slash but not run on tag pushes
  schedule:
    - cron: '0 4 * * *' # nightly, includes specs that pull requests skip
  workflow_dispatch:

jobs:
  pull-request-for-push:
    if: github.event_name == 'push'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/pull_request_for_push.yml

  busted:
    needs: pull-request-for-push
    if: ${{ !cancelled() && needs.pull-request-for-push.outputs.has-pull-request != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      LUX_VERSION: '0.54.0'

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 2 # the merge commit and base tip

    - name: Skip mission specs
      if: github.event_name == 'pull_request'
      env:
        MISSION_SPEC_INPUTS: >-
          ^(luarules/mission_api/|spec/mission_api/|luarules/gadgets/api_mission|luaui/Widgets/api_mission|singleplayer/|common/|gamedata/|spec/builders/|spec/support/|spec/spec_helper\.lua$|\.github/workflows/test_unit\.yml$|\.busted$|lux\.)
      run: |
        changed=$(git diff --name-only HEAD^1 HEAD)
        if ! grep -qE "$MISSION_SPEC_INPUTS" <<< "$changed"; then
          echo "SPEC_SKIP=mission_api" >> "$GITHUB_ENV"
          echo "::notice title=Mission specs skipped::No changed file is a mission spec input. Pushes to master and the nightly run cover them."
        fi

    - name: Install Lua 5.1
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev

    - name: Cache the lux binary
      uses: actions/cache@v4
      with:
        path: ~/.cache/lx-bin
        key: lx-bin-${{ env.LUX_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Lux
      run: |
        # Fetch the prebuilt `lx` straight from the release page. Resolving
        # it through cargo-binstall (or the lux action) goes via the GitHub
        # API, which sporadically rate-limits unauthenticated runners;
        # release downloads don't count against that limit.
        if [ ! -x ~/.cache/lx-bin/lx ]; then
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/lx.tar.gz" \
            "https://github.com/lumen-oss/lux/releases/download/v${LUX_VERSION}/lx-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p ~/.cache/lx-bin
          tar -xzf "$RUNNER_TEMP/lx.tar.gz" -C ~/.cache/lx-bin lx
        fi
        sudo install -m 755 ~/.cache/lx-bin/lx /usr/local/bin/lx
        lx --version

    - name: Cache Lux dependencies
      uses: actions/cache@v4
      with:
        path: .lux
        key: lux-${{ env.LUX_VERSION }}-5.1-${{ runner.os }}-${{ hashFiles('lux.lock') }}
        restore-keys: |
          lux-${{ env.LUX_VERSION }}-5.1-${{ runner.os }}-

    - name: Run busted
      run: lx --lua-version 5.1 test

    - name: Run busted in reverse file order
      env:
        SPEC_ORDER: reverse
      run: lx --lua-version 5.1 test

    - name: Report failures on master
      if: >-
        failure() && !github.event.repository.fork
        && (github.event_name == 'schedule'
          || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch))
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TITLE: Unit tests failed on master
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
        if [ -n "$issue" ]; then
          gh issue comment "$issue" --body "Failed on $GITHUB_SHA: $RUN_URL"
        else
          gh issue create --title "$TITLE" --body "Failed on $GITHUB_SHA: $RUN_URL"
        fi
