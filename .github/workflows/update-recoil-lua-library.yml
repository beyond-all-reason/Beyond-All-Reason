name: Update Recoil Lua library
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update:
    # Only run this workflow on forks if it was triggered manually. Otherwise
    # contributors will get extra commits in their PRs.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'beyond-all-reason/beyond-all-reason'
    name: Update recoil-lua-library
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            recoil-lua-library
            .github/scripts
            common/recoil
          submodules: 'true'
          # https://stackoverflow.com/a/77212392/317135
          fetch-depth: 0
          ssh-key: ${{ secrets.ACTION_RUNNER_PRIVATE }}
      - name: Pull latest submodule
        run: |
          git submodule update --remote --merge recoil-lua-library
      # What each Lua handle registers, from the library just pulled: it moves with the pin, in the same commit.
      - name: Generate the names per handle
        env:
          EMMYLUA_VERSION: 0.24.0
        run: |
          URL="https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/${EMMYLUA_VERSION}/emmylua_doc_cli-linux-x64.tar.gz"
          curl -fsSL "$URL" | sudo tar xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/emmylua_doc_cli
          python3 .github/scripts/recoil_names.py
      - name: Push updated submodule
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: recoil-lua-library common/recoil/names.lua
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit_message: |
            Update Lua libary submodule