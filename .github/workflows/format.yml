name: Format

on:
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        env:
          # Pinned deliberately: a formatter's output is the contract, so an
          # unannounced upgrade would start failing pull requests that were
          # correctly formatted when they were written.
          STYLUA_VERSION: "2.5.2"
        run: |
          curl -fsSL -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -q stylua.zip stylua
          chmod +x stylua
          ./stylua --version

      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The pull request checkout only holds the merge commit, so the base
          # revision has to be fetched before anything can be diffed against it.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          # 93 tracked Lua paths contain spaces, so the list stays NUL-separated
          # everywhere it is consumed.
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.lua' > changed.txt
          if [ ! -s changed.txt ]; then
            echo "No Lua files changed."
            exit 0
          fi

          # .stylua.toml asks for CRLF, so the input has to be CRLF or every line
          # reports as a mismatch. .gitattributes already checks *.lua out that
          # way; normalising anyway keeps the check from depending on the runner
          # reproducing it.
          while IFS= read -r -d '' file; do
            perl -pi -e 's/\r?\n/\r\n/' "$file"
          done < changed.txt

          echo "Checking:"
          tr '\0' '\n' < changed.txt

          # --respect-ignores is required because .styluaignore is bypassed for
          # paths named directly on the command line.
          xargs -0r ./stylua --check --respect-ignores < changed.txt
